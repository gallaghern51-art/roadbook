<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not on the map — Roadbook</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #080a0b; color: #f6f3eb; font-family: Barlow, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; display: grid; place-content: center; gap: 18px; padding: 32px 22px; text-align: center; }
    .brand { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; }
    .brand span { color: #ff5429; }
    h1 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: clamp(44px, 9vw, 72px); line-height: 0.94; letter-spacing: -0.02em; margin: 8px 0 0; }
    p { color: #c5c9c8; font-size: 16px; line-height: 1.6; max-width: 44ch; margin: 0 auto; }
    a.go { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 22px; border-radius: 9px; background: #ff5429; color: #17100d; font-weight: 600; text-decoration: none; margin-top: 8px; }
    a.plain { color: #56c5c8; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ROAD<span>BOOK</span></div>
    <h1>Not on the map.</h1>
    <p>That page does not exist, or it moved. Your trips are on your device and in your account, not at this address.</p>
    <a class="go" href="/">Back to Roadbook →</a>
    <p><a class="plain" href="/#help">How to use Roadbook</a></p>
  </main>
</body>
</html>
